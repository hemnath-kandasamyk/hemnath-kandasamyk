name: generate animated snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: hemnath-kandasamyk
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2390EE90,%2332CD32&color_dots=%23F3E5F5,%23D8B4E2,%23C084D9,%23A855C7,%237B2CBF&color_empty=%23FFFFFF&color_empty_text=%23E8E8E8
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300FF7F,%2300FA9A&color_dots=%232D1B3D,%234A2B5C,%237B2CBF,%23A855C7,%23D8B4E2&color_empty=%230D1117&color_empty_text=%23161B22

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
