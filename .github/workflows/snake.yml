name: generate animated snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svgs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%2322D3EE&color_dots=%23161B22,%234C1D95,%237C3AED,%23A855F7,%23F0ABFC&color_empty=%23161B22
            dist/snake.svg?color_snake=%230891B2&color_dots=%23EDE9FE,%23C4B5FD,%23A78BFA,%238B5CF6,%236D28D9&color_empty=%23EDE9FE

      - name: push to snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
