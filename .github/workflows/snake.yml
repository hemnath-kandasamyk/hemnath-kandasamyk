name: generate animated snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: hemnath-kandasamyk
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2334D399&color_dots=%23161C21,%231F6B4D,%2334D399,%2360E6B0,%23F472B6,%23EC4899&color_empty=%230D1117&color_empty_text=%238B949E
            dist/github-contribution-grid-snake.svg?color_snake=%2334D399&color_dots=%23E2E8F0,%23A7F3D0,%2334D399,%2360E6B0,%23F472B6,%23EC4899&color_empty=%23FFFFFF&color_empty_text=%23CBD5E1

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
